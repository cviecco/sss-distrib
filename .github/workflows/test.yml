on: [push, pull_request]
name: Test
jobs:
  testlinux:
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    - uses: actions/checkout@v5
    - run: make test
  covercheck:
    name: covercheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-go@v6
    - uses: actions/checkout@v5
    - run: make coverage.txt
    - uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}


