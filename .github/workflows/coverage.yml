on: [push, pull_request]
name: Coverage
  covercheck:
    name: covercheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-go@v6
      with:
        go-version: 1.26.x
    - uses: actions/checkout@v5
    - run: make clean
    - run: make test
    - run: make coverage.txt
    - uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}


